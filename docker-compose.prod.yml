# =====================================================================
# Ajustes de produção. Use SEMPRE junto com o arquivo principal:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# NÃO declare "ports" aqui. Ao juntar dois -f o Compose CONCATENA a lista
# de portas em vez de substituir (a chave de unicidade é {ip, target,
# published, protocol}), então um "127.0.0.1:5432:5432" aqui não trocaria
# o "5432:5432" do arquivo base — somaria a ele. O container tentaria abrir
# as duas e morreria com "address already in use" contra a própria
# publicação anterior.
#
# Quem decide o bind é o docker-compose.yml, pelas variáveis do .env:
#   POSTGRES_BIND_IP / PGADMIN_BIND_IP  (padrão 127.0.0.1)
# =====================================================================
services:
  pgadmin:
    environment:
      # em produção o pgAdmin pede login de verdade
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
