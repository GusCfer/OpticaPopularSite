# =====================================================================
# Óptica Popular — Nginx
#
#   sudo cp deploy/nginx-otica.conf /etc/nginx/sites-available/otica
#   sudo ln -s /etc/nginx/sites-available/otica /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# O Nginx serve o site já compilado e repassa /api e /uploads para a API.
# Site e API ficam na MESMA origem — não existe CORS entre eles, e o
# Cloudflare Tunnel só precisa apontar para http://localhost:8080.
#
# PORTA 8080, e não 80: neste servidor o CasaOS já escuta na 80. Como quem
# fala com o Nginx é só o cloudflared (no próprio localhost), a porta é
# indiferente — e assim nada do CasaOS precisa ser mexido. Confira o que
# está em uso antes:  sudo ss -lntp | grep -E ':(80|8080)\b'
# =====================================================================

server {
    # Só IPv4: quem fala com o Nginx é o cloudflared, no próprio localhost.
    # (Um "listen [::]:8080" derruba o Nginx em servidor com IPv6 desativado.)
    listen 127.0.0.1:8080;
    server_name _;

    # Apenas o site COMPILADO. Nunca aponte para /opt/otica/frontend: aquela
    # pasta tem o código-fonte, o node_modules e o .env do build.
    root /var/www/otica;
    index index.html;

    # o upload de imagem do painel aceita até 5 MB; sobra folga
    client_max_body_size 8M;

    access_log /var/log/nginx/otica.access.log;
    error_log  /var/log/nginx/otica.error.log;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # ---- API ----
    location /api/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # o rate limit da API usa isto para saber o IP de verdade
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- fotos dos produtos (servidas pela própria API) ----
    location /uploads/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    # ---- arquivos do Vite: nome com hash, podem ser cacheados pra sempre ----
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- SPA: qualquer rota devolve o index.html ----
    # sem isto, recarregar a página em /admin dá 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
