# =====================================================================
# Cloudflare Tunnel — /etc/cloudflared/config.yml
#
#   # instalação pelo repositório oficial da Cloudflare:
#   sudo mkdir -p --mode=0755 /usr/share/keyrings
#   curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
#     | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
#   echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' \
#     | sudo tee /etc/apt/sources.list.d/cloudflared.list
#   sudo apt update && sudo apt install -y cloudflared
#
#   cloudflared tunnel login
#   cloudflared tunnel create otica
#   cloudflared tunnel route dns otica oticapopular.com.br
#   cloudflared tunnel route dns otica www.oticapopular.com.br
#   sudo cloudflared service install
#
# Troque <ID-DO-TUNEL> pelo id que o "tunnel create" imprimiu e os
# hostnames pelo seu domínio.
# =====================================================================

tunnel: <ID-DO-TUNEL>
credentials-file: /etc/cloudflared/<ID-DO-TUNEL>.json

# Um tunnel só, apontando para o Nginx local (porta 8080 — a 80 é do CasaOS).
ingress:
  - hostname: oticapopular.com.br
    service: http://localhost:8080
  - hostname: www.oticapopular.com.br
    service: http://localhost:8080

  # tudo que não bater com os hostnames acima morre aqui
  - service: http_status:404

# ---------------------------------------------------------------------
# NÃO publique o pgAdmin (5050) nem o Postgres (5432) pelo tunnel sem
# proteger com o Cloudflare Access. Para administrar o banco, use um
# túnel SSH da sua máquina:
#
#   ssh -L 5050:localhost:5050 usuario@servidor
#   # e abra http://localhost:5050 no seu navegador
# ---------------------------------------------------------------------
