services:
  db:
    image: postgres:16-alpine
    container_name: otica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-otica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otica_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-otica_popular}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-otica} -d ${POSTGRES_DB:-otica_popular}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - otica-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: otica-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@oticapopular.com.br}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - otica-net

volumes:
  postgres_data:
  pgadmin_data:

networks:
  otica-net:
    driver: bridge
